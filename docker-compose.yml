services:
  neo4j:
    image: neo4j:5-community
    container_name: tracelink-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/tracelink123
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "tracelink123", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 15
volumes:
  neo4j_data:
